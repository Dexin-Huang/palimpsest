<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.page_id }} | Palimpsest Scanlation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
{{ css }}
  </style>
</head>
<body>
  <div class="scanlation-container">
    <!-- Controls -->
    <div class="controls">
      <label>
        Text Layer:
        <select id="layerSelect">
          {% for layer_name, layer_label in available_layers %}
          <option value="{{ layer_name }}"{% if layer_name == layer %} selected{% endif %}>{{ layer_label }}</option>
          {% endfor %}
        </select>
      </label>

      <label>
        <input type="checkbox" id="showOriginal">
        Show original alongside
      </label>

      <div class="view-toggle">
        <button id="btnText" class="active">Text</button>
        <button id="btnOverlay">Overlay</button>
      </div>
    </div>

    <!-- Main content -->
    <div class="content-wrapper">
      <div class="side-by-side" id="sideBySide" style="display: none;">
        <div class="original-image">
          <img src="{{ image_path }}" alt="Original manuscript page" id="originalImg">
        </div>
        <div class="manuscript {% if layout and layout.columns == 2 %}two-column{% else %}single-column{% endif %}" data-folio="{{ page.page_id }}">
          {% for zone in zones %}
          {{ render_zone(zone, layer) }}
          {% endfor %}
        </div>
      </div>

      <div class="manuscript-only" id="manuscriptOnly">
        <div class="manuscript {% if layout and layout.columns == 2 %}two-column{% else %}single-column{% endif %}" data-folio="{{ page.page_id }}">
          {% for zone in zones %}
          {{ render_zone(zone, layer) }}
          {% endfor %}
        </div>
      </div>
    </div>

    <!-- Tooltip -->
    <div class="zone-tooltip" id="tooltip">
      <div class="tooltip-header"></div>
      <div class="tooltip-text"></div>
    </div>
  </div>

  <script>
    // Page data for interactivity
    const PAGE = {{ page_json | safe }};
    const LAYERS = {{ available_layers_json | safe }};

    // Layer switching
    document.getElementById('layerSelect').addEventListener('change', function() {
      const layer = this.value;
      document.querySelectorAll('.zone').forEach(el => {
        const zoneId = el.dataset.zoneId;
        const zone = PAGE.zones.find(z => z.zone_id === zoneId);
        if (zone && zone.text && zone.text[layer]) {
          el.textContent = zone.text[layer];
        }
      });
    });

    // Side-by-side toggle
    document.getElementById('showOriginal').addEventListener('change', function() {
      const sideBySide = document.getElementById('sideBySide');
      const manuscriptOnly = document.getElementById('manuscriptOnly');
      if (this.checked) {
        sideBySide.style.display = 'grid';
        manuscriptOnly.style.display = 'none';
      } else {
        sideBySide.style.display = 'none';
        manuscriptOnly.style.display = 'block';
      }
    });

    // Tooltip on hover
    const tooltip = document.getElementById('tooltip');
    document.querySelectorAll('.zone').forEach(el => {
      el.addEventListener('mouseenter', function(e) {
        const zoneId = this.dataset.zoneId;
        const zone = PAGE.zones.find(z => z.zone_id === zoneId);
        if (zone) {
          const header = document.querySelector('.tooltip-header');
          const text = document.querySelector('.tooltip-text');
          header.textContent = `${zone.type.toUpperCase()} • ${zone.zone_id}`;

          // Show diplomatic version if viewing translation, or vice versa
          const currentLayer = document.getElementById('layerSelect').value;
          let altText = '';
          if (currentLayer.includes('en_') && zone.text.la_diplomatic) {
            altText = zone.text.la_diplomatic;
          } else if (currentLayer.includes('la_') && zone.text.en_interpreted) {
            altText = zone.text.en_interpreted;
          } else if (currentLayer.includes('es_') && zone.text.en_interpreted) {
            altText = zone.text.en_interpreted;
          }
          text.textContent = altText || '(no alternate text)';

          tooltip.classList.add('visible');
        }
      });

      el.addEventListener('mousemove', function(e) {
        tooltip.style.left = (e.clientX + 15) + 'px';
        tooltip.style.top = (e.clientY + 15) + 'px';
      });

      el.addEventListener('mouseleave', function() {
        tooltip.classList.remove('visible');
      });
    });

    // View toggle (Text vs Overlay - placeholder for future)
    document.getElementById('btnText').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btnOverlay').classList.remove('active');
    });

    document.getElementById('btnOverlay').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btnText').classList.remove('active');
      // TODO: Implement overlay view with positioned text over image
    });
  </script>
</body>
</html>
