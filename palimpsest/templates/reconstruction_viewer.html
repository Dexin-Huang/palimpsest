<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PAGE_ID}} | Palimpsest Reconstruction Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-dark: #0d1117;
            --bg-medium: #161b22;
            --bg-light: #21262d;
            --accent: #c9a050;
            --accent-dim: #8b6914;
            --text: #e6edf3;
            --text-dim: #8b949e;
            --border: #30363d;
        }

        body {
            font-family: 'EB Garamond', Georgia, serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg-medium);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--accent);
            letter-spacing: 0.1em;
        }

        .header-left .subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .header-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* Controls */
        .controls {
            background: var(--bg-light);
            padding: 0.75rem 2rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .control-group label {
            color: var(--text-dim);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* View toggle buttons */
        .view-toggle {
            display: flex;
            background: var(--bg-dark);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .view-toggle button {
            padding: 0.5rem 1rem;
            border: none;
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .view-toggle button:hover {
            color: var(--text);
            background: var(--bg-medium);
        }

        .view-toggle button.active {
            background: var(--accent-dim);
            color: var(--text);
        }

        .view-toggle button:not(:last-child) {
            border-right: 1px solid var(--border);
        }

        /* Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 4px;
            background: var(--bg-dark);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        /* Main viewer */
        .viewer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow: auto;
        }

        .image-container {
            position: relative;
            max-width: 100%;
            max-height: calc(100vh - 200px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        .image-container img {
            max-width: 100%;
            max-height: calc(100vh - 200px);
            display: block;
        }

        .overlay-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .hidden {
            display: none !important;
        }

        /* Side by side view */
        .side-by-side {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        .side-by-side .image-container {
            flex: 1;
            max-width: calc(50% - 1rem);
        }

        .side-by-side .image-label {
            text-align: center;
            padding: 0.5rem;
            background: var(--bg-medium);
            color: var(--text-dim);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Zone info panel */
        .info-panel {
            position: fixed;
            right: 0;
            top: 150px;
            width: 300px;
            max-height: calc(100vh - 200px);
            background: var(--bg-medium);
            border-left: 1px solid var(--border);
            padding: 1rem;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .info-panel.open {
            transform: translateX(0);
        }

        .info-panel h3 {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .zone-list {
            list-style: none;
        }

        .zone-list li {
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            background: var(--bg-light);
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .zone-list li:hover {
            background: var(--bg-dark);
        }

        .zone-list .zone-id {
            font-weight: 600;
            color: var(--accent);
        }

        .zone-list .zone-type {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .zone-list .zone-text {
            font-size: 0.9rem;
            margin-top: 0.25rem;
            color: var(--text);
            font-style: italic;
        }

        /* Info panel toggle */
        .info-toggle {
            position: fixed;
            right: 0;
            top: 150px;
            background: var(--bg-medium);
            border: 1px solid var(--border);
            border-right: none;
            padding: 0.5rem;
            cursor: pointer;
            color: var(--accent);
            border-radius: 4px 0 0 4px;
            transition: all 0.3s ease;
        }

        .info-toggle:hover {
            background: var(--bg-light);
        }

        .info-panel.open + .info-toggle {
            right: 300px;
        }

        /* Loading indicator */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent);
            font-size: 1.2rem;
        }

        /* Zoom controls */
        .zoom-controls {
            display: flex;
            gap: 0.5rem;
        }

        .zoom-controls button {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            background: var(--bg-dark);
            color: var(--text);
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-controls button:hover {
            background: var(--bg-medium);
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>{{PAGE_ID}}</h1>
            <div class="subtitle">{{DOC_ID}} &bull; Palimpsest Reconstruction</div>
        </div>
        <div class="header-right">
            <div class="zoom-controls">
                <button id="zoom-out" title="Zoom out">&minus;</button>
                <button id="zoom-reset" title="Reset zoom">1:1</button>
                <button id="zoom-in" title="Zoom in">+</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>View</label>
            <div class="view-toggle">
                <button id="btn-original" class="active">Original</button>
                <button id="btn-overlay">Translated</button>
                <button id="btn-reconstructed">Reconstructed</button>
                <button id="btn-compare">Compare</button>
            </div>
        </div>

        <div class="control-group" id="opacity-control">
            <label>Overlay</label>
            <input type="range" id="opacity" min="0" max="100" value="80">
        </div>
    </div>

    <div class="viewer">
        <!-- Original view -->
        <div id="view-original" class="image-container">
            <img src="{{ORIGINAL_PATH}}" alt="Original manuscript page" id="original-img">
        </div>

        <!-- Overlay view -->
        <div id="view-overlay" class="image-container hidden">
            <img src="{{ORIGINAL_PATH}}" alt="Original">
            <img src="{{OVERLAY_PATH}}" alt="Translation overlay" class="overlay-img" id="overlay-img">
        </div>

        <!-- Reconstructed view -->
        <div id="view-reconstructed" class="image-container hidden">
            <img src="{{RECONSTRUCTED_PATH}}" alt="Reconstructed English page">
        </div>

        <!-- Comparison view -->
        <div id="view-compare" class="side-by-side hidden">
            <div class="image-container">
                <div class="image-label">Original</div>
                <img src="{{ORIGINAL_PATH}}" alt="Original">
            </div>
            <div class="image-container">
                <div class="image-label">Reconstructed</div>
                <img src="{{RECONSTRUCTED_PATH}}" alt="Reconstructed">
            </div>
        </div>
    </div>

    <!-- Zone info panel -->
    <div class="info-panel" id="info-panel">
        <h3>Text Zones</h3>
        <ul class="zone-list" id="zone-list">
            <!-- Populated by JavaScript -->
        </ul>
    </div>
    <button class="info-toggle" id="info-toggle" title="Toggle zone list">&#9776;</button>

    <script>
        // Page data
        const PAGE = {{PAGE_JSON}};

        // View switching
        const views = ['original', 'overlay', 'reconstructed', 'compare'];
        const opacityControl = document.getElementById('opacity-control');

        views.forEach(view => {
            const btn = document.getElementById(`btn-${view}`);
            if (btn) {
                btn.addEventListener('click', () => {
                    views.forEach(v => {
                        const el = document.getElementById(`view-${v}`);
                        const b = document.getElementById(`btn-${v}`);
                        if (el) el.classList.add('hidden');
                        if (b) b.classList.remove('active');
                    });

                    document.getElementById(`view-${view}`)?.classList.remove('hidden');
                    btn.classList.add('active');

                    // Show/hide opacity control
                    if (view === 'overlay') {
                        opacityControl.style.display = 'flex';
                    } else {
                        opacityControl.style.display = 'none';
                    }
                });
            }
        });

        // Initially hide opacity control
        opacityControl.style.display = 'none';

        // Opacity control
        const opacitySlider = document.getElementById('opacity');
        const overlayImg = document.getElementById('overlay-img');

        if (opacitySlider && overlayImg) {
            opacitySlider.addEventListener('input', (e) => {
                overlayImg.style.opacity = e.target.value / 100;
            });
            // Set initial opacity
            overlayImg.style.opacity = 0.8;
        }

        // Zone list
        const zoneList = document.getElementById('zone-list');
        if (PAGE.zones && zoneList) {
            PAGE.zones.forEach(zone => {
                const text = zone.text?.en_interpreted || zone.text?.en_literal ||
                            zone.text?.la_normalized || zone.text?.la_diplomatic || '';

                if (!text) return;

                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="zone-id">${zone.zone_id}</span>
                    <span class="zone-type">${zone.type}</span>
                    <div class="zone-text">${text.substring(0, 100)}${text.length > 100 ? '...' : ''}</div>
                `;
                zoneList.appendChild(li);
            });
        }

        // Info panel toggle
        const infoPanel = document.getElementById('info-panel');
        const infoToggle = document.getElementById('info-toggle');

        if (infoToggle && infoPanel) {
            infoToggle.addEventListener('click', () => {
                infoPanel.classList.toggle('open');
            });
        }

        // Zoom controls
        let zoomLevel = 1;
        const zoomStep = 0.25;
        const minZoom = 0.25;
        const maxZoom = 4;

        function updateZoom() {
            document.querySelectorAll('.image-container img').forEach(img => {
                img.style.transform = `scale(${zoomLevel})`;
                img.style.transformOrigin = 'center center';
            });
        }

        document.getElementById('zoom-in')?.addEventListener('click', () => {
            zoomLevel = Math.min(zoomLevel + zoomStep, maxZoom);
            updateZoom();
        });

        document.getElementById('zoom-out')?.addEventListener('click', () => {
            zoomLevel = Math.max(zoomLevel - zoomStep, minZoom);
            updateZoom();
        });

        document.getElementById('zoom-reset')?.addEventListener('click', () => {
            zoomLevel = 1;
            updateZoom();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case '1': document.getElementById('btn-original')?.click(); break;
                case '2': document.getElementById('btn-overlay')?.click(); break;
                case '3': document.getElementById('btn-reconstructed')?.click(); break;
                case '4': document.getElementById('btn-compare')?.click(); break;
                case '+':
                case '=': document.getElementById('zoom-in')?.click(); break;
                case '-': document.getElementById('zoom-out')?.click(); break;
                case '0': document.getElementById('zoom-reset')?.click(); break;
                case 'i': infoToggle?.click(); break;
            }
        });
    </script>
</body>
</html>
