schema_version: 1
id: "read/mthv2-development/v2"
station: read
qualification_eligible: false
mission: >-
  Development gate on the same 24 MTHv2 official-test pages as v1, eight per
  corpus. The dataset's annotated text lines remain positive partial references.
  Primary comparison applies the conservative, symmetric Han variant table v1
  to candidate and reference before alignment. Exact diplomatic partial-gold
  error remains a reported, non-penalizing hard-limit diagnostic. Contamination,
  repetition, and empty output remain hard failures. This suite cannot qualify
  promotion.
case_manifest: read/mthv2-development-v1.jsonl
primary_metrics:
  han_variant_v1_partial_gold_character_error_rate:
    direction: minimize
    minimum_effect: 0.0
    confidence: 0.8
  page_completeness:
    direction: maximize
    minimum_effect: 0.0
    confidence: 0.8
hard_limits:
  contamination_rate: {maximum: 0.0}
  empty_output_rate: {maximum: 0.0}
  invented_character_rate: {maximum: 1.0}
  partial_gold_character_error_rate: {maximum: 1.0}
  repetition_rate: {maximum: 0.1}
protected_slices:
  - mth1000
  - mth1200
  - tkh
slice_policy:
  minimum_cases: 1
  maximum_regression: 0.1
operational_limits: {}
judges: []
downstream_probes:
  - id: read-to-align/v1
promotion:
  minimum_completed_cases: 24
  paired_bootstrap_samples: 1000
  seed: 361004
  require_all_hard_limits: true
  require_all_downstream_probes: true
