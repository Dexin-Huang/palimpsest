name: chinese_scroll
language: zh
line:
  page:
    - station: acquire
    - station: deframe
    - station: dewatermark
    - station: flatten
      mode: attenuate
    - station: segment
      full_page_max_lines: 999
      full_page_max_regions: 99
    - station: read
      model: ${PALIMPSEST_MODEL_VISION}
      prompt: read/zh/diplomatic
      params: { temperature: 0.7, media_resolution: high,
                max_output_tokens: 32768, thinking_budget: 0 }
    - station: translate
      model: ${PALIMPSEST_MODEL_READING}
      prompt: translate/zh/with_brief
      overlap: 1
    - station: assemble_page
  manuscript:
    - station: survey
      model: ${PALIMPSEST_MODEL_READING}
      prompt: survey/generic/brief
    - station: reconstruct
      model: ${PALIMPSEST_MODEL_READING}
      prompt: reconstruct/generic/structure
    - station: publish
      original_language: zh
    - station: render_epub
