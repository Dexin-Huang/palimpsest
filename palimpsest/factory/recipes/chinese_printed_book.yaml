name: chinese_printed_book
language: zh
line:
  - station: acquire
  - station: deframe
  - station: dewatermark
  - station: flatten
    mode: attenuate
  - station: segment
    full_page_max_lines: 999
    full_page_max_regions: 99
  - station: read
    model: ${PALIMPSEST_MODEL_READING}
    prompt: read/zh/diplomatic
    params:
      temperature: 0.1
      media_resolution: high
      max_output_tokens: 32768
      thinking_level: low
      secondary_model: ${PALIMPSEST_MODEL_READING_SECONDARY}
      secondary_thinking_level: null
      adjudicator_model: ${PALIMPSEST_MODEL_ADJUDICATOR}
      adjudicator_thinking_level: high
  - station: align
    variant: rfdetr-mth600/v1
    checkpoint_sha256: cdc06d36dd2273e139571b3196d58c13dee11211ec847fadffa9fee3af46624d
    nms_iou: 0.4
    overlap: 96
    rfdetr_version: 1.8.3
    threshold: 0.31
    tile_size: 512
    torch_version: 2.7.0+cu118
    torchvision_version: 0.22.0+cu118
  - station: survey
    model: ${PALIMPSEST_MODEL_EDITORIAL}
    prompt: survey/generic/brief
  - station: translate
    model: ${PALIMPSEST_MODEL_EDITORIAL}
    prompt: translate/zh/with_brief
    overlap: 1
  - station: assemble_page
  - station: reconstruct
    model: ${PALIMPSEST_MODEL_EDITORIAL}
    prompt: reconstruct/generic/structure
  - station: reference
    model: gpt-5.6-sol
    prompt: reference/generic/identify
  - station: emend
    model: gpt-5.6-luna
    prompt: emend/generic/agent
  - station: finalize_edition
    model: gpt-5.6-sol
    prompt: finalize/generic/edition
  - station: publish
    original_language: zh
  - station: render_epub
