name: latin_manuscript
language: la
line:
  - station: acquire
  - station: deframe
  - station: dewatermark
  - station: flatten
    mode: attenuate
  - station: segment
    # full-page-first: continuous reads preserve the context that makes
    # dense transcription accurate (blind-judge finding, 2026-07-10);
    # tiles remain the automatic escalation for truncated reads and the
    # blank/figure machinery stays
    full_page_max_lines: 999
    full_page_max_regions: 99
  - station: read
    model: ${PALIMPSEST_MODEL_READING}
    prompt: read/la/diplomatic
    # Temperature remains for optional bare-Gemini overrides; OMP does not
    # expose sampling temperature. Both readers receive the identical image.
    params:
      temperature: 0.7
      media_resolution: low
      max_output_tokens: 32768
      thinking_level: low
      secondary_model: ${PALIMPSEST_MODEL_READING_SECONDARY}
      secondary_thinking_level: null
      adjudicator_model: ${PALIMPSEST_MODEL_ADJUDICATOR}
      adjudicator_thinking_level: high
  - station: survey
    model: ${PALIMPSEST_MODEL_READING}
    prompt: survey/generic/brief
  - station: translate
    model: ${PALIMPSEST_MODEL_READING}
    prompt: translate/la/with_brief
    overlap: 1
  - station: assemble_page
  - station: reconstruct
    model: ${PALIMPSEST_MODEL_READING}
    prompt: reconstruct/generic/structure
  - station: reference
    model: gpt-5.6-sol
    prompt: reference/generic/identify
  - station: emend
    model: gpt-5.6-luna
    prompt: emend/generic/agent
  - station: publish
    original_language: la
  - station: render_epub
