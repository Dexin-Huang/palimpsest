[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palimpsest-cli"
version = "0.2.0"
description = "A provenance-first factory for recovering readable books from manuscripts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Dexin Huang", email = "dh3172@columbia.edu" },
]
keywords = [
  "manuscript",
  "transcription",
  "IIIF",
  "digital-humanities",
  "epub",
  "provenance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Text Processing :: Linguistic",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
urls = { "Homepage" = "https://github.com/Dexin-Huang/palimpsest", "Repository" = "https://github.com/Dexin-Huang/palimpsest", "Documentation" = "https://github.com/Dexin-Huang/palimpsest#readme" }
dependencies = [
  "google-genai>=2.12.1,<3",
  "httpx>=0.28.1,<1",
  "jsonschema>=4.25.1,<5",
  "requests>=2.28.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
  "EbookLib>=0.18",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "genai-prices>=0.0.71,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.15.10,<1", "setuptools>=77", "wheel"]

[project.scripts]
palimpsest = "palimpsest.cli:main"

[tool.setuptools]
# Runtime data is declared explicitly below; do not admit files implicitly
# through source manifests or VCS plugins.
include-package-data = false

[tool.setuptools.packages.find]
include = ["palimpsest*"]

[tool.setuptools.package-data]
"palimpsest.factory" = [
  "recipes/*.yaml",
  "prompts/**/*.txt",
  "candidates/**/*.yaml",
  "judges/**/*.yaml",
  "evaluation/suites/**/*.yaml",
  "evaluation/cases/**/*.json",
  "evaluation/cases/**/*.jsonl",
  "evaluation/cases/**/*.jpg",
  "evaluation/cases/**/*.pgm",
  "evaluation/gold/**/*.json",
  "evaluation/gold/**/*.jpg",
  "evaluation/gold/**/*.epub",
  "publication_contract/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# google-genai still uses this private typing alias on Python 3.14:
# https://github.com/googleapis/python-genai/issues/1640
filterwarnings = [
 "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3\\.17:DeprecationWarning:google\\.genai\\.types",
]
