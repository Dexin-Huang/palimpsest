[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palimpsest-cli"
version = "0.1.0"
description = "Local CLI and worker wrapper for the Palimpsest workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "claude-agent-sdk>=0.1",
  "requests>=2.28.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "aiohttp>=3.9.0",
  "lxml>=5.0.0",
  "reportlab>=4.0.0",
  "Pillow>=10.0.0",
]

[project.scripts]
palimpsest = "palimpsest.cli:main"

[tool.setuptools.packages.find]
include = ["palimpsest*"]
